apiVersion: v1
kind: Namespace 
metadata:
  name: roboshop
  labels:
    name: roboshop
    environment: dev
    purpose: poc

#kind is the type of Kubernetes resource we want to create. In this case, we want to create a Namespace.
# Namespace means a virtual cluster within the Kubernetes cluster. It allows us to organize and manage resources in a logical way. 
#metadata is a section that contains information about the resource we are creating.
# labels are key-value pairs that we can use to categorize and organize our resources.